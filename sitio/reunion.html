<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Condominio</title>
<link rel="stylesheet" href="css/sitio.css">
<link rel="stylesheet" href="css/reunion.css">
</head>
<body data-pagina="reunion">
<main id="pagina" class="rv-pg">
  <div id="app"><div class="vacio"><div class="big">⏳</div><p>Cargando la reunión…</p></div></div>
  <a class="mas" href="acuerdos.html">🤝 Todos los acuerdos ›</a>
</main>
<script src="js/condominio.js"></script>
<script src="js/sitio.js"></script>
<script src="js/ventana.js"></script>
<script src="js/reunion.js"></script>
<script>
(function () {
  "use strict";
  const R = window.Reunion, esc = R.esc, app = document.getElementById("app");
  if (!R.URL) { app.innerHTML = '<div class="vacio"><div class="big">🔌</div><p>El sitio todavía no está conectado con la hoja.</p></div>'; return; }
  let J = null, tm = null;

  function pintar(j) {
    J = j; const r = j.reunion;
    if (!r) { app.innerHTML = '<div class="vacio"><div class="big">🗓️</div><h2 style="margin:.3rem 0">Sin reunión programada</h2><p style="color:var(--ink-2)">Cuando la mesa directiva convoque, aquí verás la fecha, el orden del día y la votación.</p></div>' + anteriores(j); return; }
    const c = R.cuando(r), cerr = r.estado === "Cerrada", vivo = r.estado === "En curso", vot = r.temas.filter(t => t.tipo === "vota");
    const fecha = R.fecha(r.fecha).replace(/^./, x => x.toUpperCase()) + (r.hora ? " · " + R.hora(r.hora) : "");
    let h = '<section class="hero-r"><p class="k">' + esc(r.tipo === "Asamblea" ? "Asamblea" : "Reunión") + ' <span class="chip ' + c.c + '">' + c.t + "</span></p><h1>" + esc(r.titulo) + '</h1><p class="cu">🗓️ ' + esc(fecha) + "</p>" +
      (r.lugar ? '<p class="lu">📍 ' + esc(r.lugar) + "</p>" : "") + (r.convocatoria && !cerr ? '<p class="conv">' + esc(r.convocatoria) + "</p>" : "") + '<div class="bts">';
    if (r.enlace && !cerr) h += '<a class="bt p full" href="' + esc(r.enlace) + '" target="_blank" rel="noopener">🎥 ' + (vivo ? "Entrar ahora a la videollamada" : "Liga de la videollamada") + "</a>";
    if (!cerr) h += '<button type="button" class="bt" id="bCal">📅 A mi calendario</button><a class="bt" href="' + R.wa(r) + '" target="_blank" rel="noopener">💬 Compartir</a>';
    h += '<button type="button" class="bt' + (cerr ? "" : " full") + '" id="bPres">▶ Ver la presentación</button>' + (cerr && r.minuta ? '<a class="bt p" href="' + esc(r.minuta) + '" target="_blank" rel="noopener">📄 Minuta</a>' : "") + "</div>";
    if (vivo || R.presentes(r)) { const a = R.presentes(r), u = j.unidades;
      h += '<div class="qr"><span>👥 ' + a + " de " + u + '</span><i><u style="width:' + Math.round(a / u * 100) + '%"></u></i><b>' + (a >= j.quorum ? "✅ Quórum" : "Quórum " + j.quorum) + "</b></div>"; }
    h += "</section>";

    if (cerr) {
      const ac = r.temas.filter(t => t.acuerdo);
      h += '<h2 class="t">✅ Lo que se acordó</h2>' + (ac.length ? '<div class="card-v">' + ac.map(t => '<div class="rv-ac"><b>' + esc(t.acuerdo) + "</b><small>" + esc([t.responsable && "👤 " + t.responsable, t.compromiso && "📅 " + t.compromiso].filter(Boolean).join(" · ")) + "</small></div>").join("") + "</div>" : '<p style="color:var(--ink-2)">Sin acuerdos registrados.</p>');
      h += r.minuta ? '<a class="min" href="' + esc(r.minuta) + '" target="_blank" rel="noopener"><span>📄</span><div>Leer la minuta<small>' + esc(R.fechaCorta(r.fecha)) + "</small></div></a>"
        : '<div class="min no"><span>📄</span><div>Minuta en camino<small>La mesa la sube en cuanto esté lista.</small></div></div>';
    }
    if ((vivo || cerr) && vot.length) {
      h += '<h2 class="t">🗳️ ' + (vivo ? "Votación en vivo" : "Resultados") + "</h2>";
      vot.forEach(t => { h += '<div class="card-v"><p class="kk">Tema ' + (r.temas.indexOf(t) + 1) + '</p><p class="q">' + esc(t.pregunta || t.titulo) + "</p>" + R.barras(t, (r.votos || {})[t.id], { unidades: j.unidades }) + "</div>"; });
    }
    h += '<h2 class="t">📋 Orden del día</h2><div class="od">' + r.temas.map((t, i) => '<button type="button" class="rv-ti" data-t="' + i + '"><span><b>' + esc(t.titulo) + (t.tipo === "vota" ? '<span class="tg">se vota</span>' : "") + "</b>" +
      (t.texto ? "<small>" + esc(String(t.texto).split(/\n/)[0].slice(0, 70)) + "</small>" : "") + '</span><span class="fl">›</span></button>').join("") + "</div>";
    if (cerr) h += '<p style="text-align:center;color:var(--muted);margin-top:1.2rem">🗓️ Próxima reunión: por definir</p>';
    h += anteriores(j);
    app.innerHTML = h;
    const bc = document.getElementById("bCal"); if (bc) bc.onclick = () => R.ics(r);
    document.getElementById("bPres").onclick = () => R.presentar(r, { quorum: j.quorum, unidades: j.unidades }, () => R.cargar().then(n => n.reunion));
    clearTimeout(tm); if (vivo) tm = setTimeout(cargar, 8000);
  }

  function anteriores(j) {
    const A = j.anteriores || []; if (!A.length) return "";
    return '<h2 class="t">📚 Reuniones anteriores</h2><div class="od">' + A.map((x, i) => '<button type="button" class="rv-ti rv-ant" data-an="' + i + '"><span><b>' + esc(x.titulo) + "</b><small>" + esc(R.fechaCorta(x.fecha)) + " · " + (x.minuta ? "📄 minuta" : "minuta en camino") + " · " + x.temas.filter(t => t.acuerdo).length + ' acuerdos</small></span><span class="fl">›</span></button>').join("") + "</div>";
  }
  app.addEventListener("click", e => {
    const an = e.target.closest("[data-an]");
    if (an && J) { const x = J.anteriores[+an.dataset.an], res = x.resultados || {};
      let h = x.minuta ? '<div class="acc"><a class="p" href="' + esc(x.minuta) + '" target="_blank" rel="noopener">📄 Leer la minuta</a></div>' : '<p class="exp">La minuta todavía no se publica.</p>';
      x.temas.filter(t => t.acuerdo).forEach(t => { h += '<div class="rv-ac"><b>✅ ' + esc(t.acuerdo) + "</b><small>" + esc([t.responsable, t.compromiso].filter(Boolean).join(" · ")) + "</small></div>"; });
      x.temas.filter(t => res[t.id]).forEach(t => { h += '<p style="font-weight:800;margin:1rem 0 .5rem">🗳️ ' + esc(t.pregunta || t.titulo) + "</p>" + R.barras(t, res[t.id], { unidades: J.unidades }); });
      window.ventana(x.titulo, h); return; }
    const b = e.target.closest("[data-t]"); if (!b || !J) return;
    const r = J.reunion, t = r.temas[+b.dataset.t];
    const lineas = String(t.texto || "").split(/\n+/).map(s => s.replace(/^[-•·*]\s*/, "").trim()).filter(Boolean);
    let h = lineas.length ? '<ul class="ex">' + lineas.map(s => "<li>" + esc(s) + "</li>").join("") + "</ul>" : "";
    if (t.tipo === "vota") h += '<div class="card-v" style="margin-top:.8rem"><p class="q">🗳️ ' + esc(t.pregunta || t.titulo) + "</p>" + (r.estado === "Convocada" ? '<p style="margin:0">' + t.opciones.map(o => '<span class="chip" style="background:var(--page);color:var(--ink);border:1px solid var(--border);margin:.15rem">' + esc(o) + "</span>").join("") + "</p>" : R.barras(t, (r.votos || {})[t.id], { unidades: J.unidades })) + "</div>";
    if (t.acuerdo) h += '<div class="rv-ac"><b>✅ ' + esc(t.acuerdo) + "</b><small>" + esc([t.responsable, t.compromiso].filter(Boolean).join(" · ")) + "</small></div>";
    window.ventana((+b.dataset.t + 1) + ". " + t.titulo, h || '<p class="exp">Se platica en la reunión.</p>');
  });

  function cargar() {
    R.cargar().then(j => { if (j && j.ok) { pintar(j); try { localStorage.setItem("cd.reunion", JSON.stringify(j)); } catch (e) {} } else throw new Error(j && j.error); })
      .catch(() => { if (!J) app.innerHTML = '<div class="vacio"><div class="big">📡</div><p>No pudimos leer la reunión. Intenta en un momento.</p></div>'; else tm = setTimeout(cargar, 15000); });
  }
  try { const g = JSON.parse(localStorage.getItem("cd.reunion") || "null"); if (g && g.ok) pintar(g); } catch (e) {}
  cargar();
})();
</script>
</body>
</html>
